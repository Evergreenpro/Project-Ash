    <style>
        * { 
            box-sizing: border-box; 
            user-select: none; 
            -webkit-user-drag: none; 
            outline: none;
        }
        #lyrics-box {
            width: 45vh; 
            height: 10vh; 
            overflow: hidden; 
            margin-bottom: 1.5vh; 
            position: relative;
            display: none;
            mask-image: linear-gradient(to bottom, transparent 0%, black 20%, black 80%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 20%, black 80%, transparent 100%);
        }

        .lyrics-container {
            position: absolute;
            width: 100%;
            top: 0;
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .lyric-line {
            min-height: 3vh;
            padding: 0.2vh 0;
            text-align: center;
            font-size: 1.3vh;
            color: #888;
            line-height: 1.3;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            row-gap: 0.2vh;
            transition: color 0.3s ease, opacity 0.3s ease, font-size 0.3s ease;
            opacity: 0.3;
        }

        .lyric-line.active {
            color: #888;
            opacity: 1;
            font-size: 1.5vh;
            font-weight: 700;
        }

        /* Word-by-word karaoke highlighting, spring/spline-driven (see the
           Spring/Spline classes and updateWordVisual() in the script below —
           ported from SpotifyPlus's beautifullyrics animation engine).
           --s = scale, --y = vertical lift, --glow-blur = shadow blur,
           --fill = % of the word "filled" with the bright color.
           Glow is plain white on purpose — not tied to album art colors. */
        .lyric-word {
            display: inline-block;
            min-width: 0;
            max-width: 100%;
            overflow-wrap: break-word;
            transform: scale(var(--s, 1)) translateY(var(--y, 0em));
            text-shadow: 0 0 var(--glow-blur, 0px) rgba(255, 255, 255, 0.85);
            background-image: linear-gradient(
                90deg,
                #fff calc(var(--fill, 0%) - 12%),
                #fff var(--fill, 0%),
                #888 calc(var(--fill, 0%) + 12%),
                #888 100%
            );
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            will-change: transform;
        }
        
        body, html {
            margin: 0; padding: 0; height: 100%;
            background-color: #030303; 
            background-image: url('bg.png'); /* Swap with your image filename */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex; justify-content: center; 
            align-items: center; 
            overflow: hidden;
        }

        /* --- AMBILIGHT --- */
       /* --- AMBILIGHT --- */
        /* --- AMBILIGHT --- */
        #ambilight-canvas {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 1; 
            filter: blur(4vh) brightness(1.2); /* Crisp, sharp glow */
            opacity: 0; transition: opacity 2s ease; pointer-events: none;
        }
        .ambilight-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5); /* Darker 75% black tint */
            z-index: 2; pointer-events: none;
        }

        /* --- LOGIN SCREEN --- */
        #enter-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5); display: flex; justify-content: center;
            align-items: center; z-index: 999; cursor: pointer;
            transition: opacity 0.8s ease;
        }

        /* --- CONTENT --- */
        .content-wrapper {
            position: relative; z-index: 10;
            display: flex; flex-direction: column; align-items: center;
            width: 100%; justify-content: center;
            opacity: 0; 
            transform: translateY(7vh) scale(0.75);
            transition: opacity 1s ease, transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform, opacity;
        }

        .visible-content { 
            opacity: 1 !important; 
            transform: translateY(50px) scale(0.75) !important; 
        }

        .content-wrapper.spotify-active {
            transform: translateY(0px) scale(0.75) !important;
        }

        .avatar {
            width: calc(100vh / 8); height: calc(100vh / 8); border-radius: 50%;
            object-fit: cover; margin-bottom: 2vh;
            box-shadow: 0 0 3vh rgba(0, 0, 0, 0.8);
        }

        h1 { 
            font-size: 3vh; letter-spacing: 0.8vh; margin: 0; 
            text-transform: uppercase; color: #fff; text-align: center;
            position: relative; cursor: default; height: 4vh; 
            display: flex; justify-content: center; align-items: center;
        }

        .nick-default, .nick-hover {
            transition: opacity 0.6s ease, transform 0.6s ease;
            position: absolute; white-space: nowrap;
        }

        .nick-hover {
            opacity: 0; transform: scale(0.85);
            color: #c394f8; text-shadow: 0 0 1vh rgba(195, 148, 248, 0.4);
        }

        h1:hover .nick-default { opacity: 0; transform: scale(1.1); }
        h1:hover .nick-hover { opacity: 1; transform: scale(1); }

        .status { font-size: 1.6vh; color: #ccc; letter-spacing: 0.3vh; margin: 1vh 0 2vh 0; text-transform: uppercase; }

        /* --- SPOTIFY --- */
        .spotify-wrapper {
            display: grid; grid-template-rows: 0fr;
            transition: grid-template-rows 0.8s cubic-bezier(0.4, 0, 0.2, 1), 
                        margin-bottom 0.8s cubic-bezier(0.4, 0, 0.2, 1), 
                        opacity 0.6s ease;
            width: 48vhx; opacity: 0; margin-bottom: 0;
        }

        .spotify-wrapper.active { 
            grid-template-rows: 1fr; opacity: 1; margin-bottom: 4vh;
        }

        .spotify-inner { overflow: hidden; display: flex; flex-direction: column; width: 100%; }

        .now-playing-text {
            font-size: 1vh; text-transform: uppercase; letter-spacing: 0.2vh;
            color: rgba(255, 255, 255, 0.4); margin-left: 0.5vh; margin-bottom: 0.8vh;
        }

        #spotify-container {
            height: 9vh;
            width: 36.5vh;
            aspect-ratio: 3.8 / 1;
            display: flex; align-items: center;
            background: rgba(255, 255, 255, 0.07); backdrop-filter: blur(1.5vh);
            padding: 0.15vh 2vh; border-radius: 2vh;
            border: 0.15vh solid rgba(255, 255, 255, 0.1);
            position: relative; overflow: hidden;
        }
        
        .track-art {
            width: auto; height: 70%; border-radius: 1vh;
            margin-right: 2vh; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            object-fit: cover; opacity: 1; transition: opacity 0.5s ease;
        }

        .track-info { display: flex; flex-direction: column; overflow: hidden; text-align: left; z-index: 1; }
        .track-name { font-size: 1.8vh; font-weight: 700; color: #fff; margin-bottom: 0.4vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-artist { font-size: 1.3vh; color: #1DB954; transition: color 0.5s ease; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 0.8vh; -webkit-text-stroke: 0.03vh rgb(250, 249, 246); }

        .progress-bg {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 0.3vh;
            background: rgba(255, 255, 255, 0.05);
        }
        #spotify-progress {
            height: 100%; width: 0%;
            background: #1DB954; 
            /* ПЛАВНОСТЬ: добавлена небольшая задержка для sine-эффекта */
            transition: width 0.1s linear, background 0.5s ease; 
            will-change: width;
        }

        /* --- SOCIAL ROW --- */
        .social-row { 
            display: flex; justify-content: center; gap: 4vh; 
            margin-bottom: 3vh; width: 100%; height: 3vh;
        }
        .icon-link { color: #aaa; transition: 0.3s; display: flex; align-items: center; }
        .icon-link svg { width: 3vh; height: 3vh; fill: currentColor; }
        .icon-link:hover { color: #fff; transform: scale(1.2); }

        /* --- MEDIA --- */
        .main-media-block { 
            height: 31vh; width: 56vh; position: relative; border-radius: 2vh;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 1); cursor: pointer;
            overflow: hidden;
        }
        .video-wrapper { width: 100%; position: relative; }
        video {
            width: 100%;
            display: block;
            height: 100%; }

        .video-controls-overlay {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 6vh;
            background: linear-gradient(to top, rgba(0,0,0,0.6) 0%, transparent 100%);
            display: flex; align-items: center; justify-content: flex-start;
            padding: 0 20px;
            opacity: 0; transition: opacity 0.3s ease;
            pointer-events: none;
        }
        .main-media-block:hover .video-controls-overlay { opacity: 1; }
        
        .play-pause-btn {
            background: none; width: 3.2vh; height: 3.2vh;
            display: flex; justify-content: center; align-items: center;
            border: none; pointer-events: auto; margin-right: 15px;
            transition: transform 0.2s ease;
        }
        .play-pause-btn:hover { transform: scale(1.1); }
        .play-pause-btn svg { width: 22px; height: 22px; fill: white; }

        .volume-container { display: flex; align-items: center; gap: 10px; pointer-events: auto; }
        .volume-icon { width: 18px; height: 18px; fill: #fff; opacity: 0.8; }

        input[type=range] { 
            -webkit-appearance: none; width: 80px; height: 3px; 
            background: rgba(255, 255, 255, 0.2); outline: none; border-radius: 2px;
        }
        input[type=range]::-webkit-slider-thumb { 
            -webkit-appearance: none; width: 12px; height: 12px; 
            border-radius: 50%; background: #fff; cursor: pointer; 
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }

        #custom-tooltip {
            position: fixed; pointer-events: none; 
            background: rgba(20, 20, 20, 0.85); backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1); color: #fff;
            padding: 8px 14px; border-radius: 8px; font-size: 11px;
            text-transform: uppercase; letter-spacing: 1.5px; opacity: 0;
            transform: scale(0.9); transition: opacity 0.2s ease, transform 0.2s ease;
            z-index: 1000; white-space: nowrap; will-change: opacity, transform;
        }
        #custom-tooltip.show { opacity: 1; transform: scale(1); }

        @keyframes breathe { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.7; } }
    
    </style>
</head>

        const colorThief = new ColorThief();

        let lastTrackId = '';
        let spotifyData = null;
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ!<>-_\\/[]{}—=+*^?#'; 

        // --- Lyrics animation engine, ported from SpotifyPlus's beautifullyrics ---
        // Natural cubic spline (port of morganherlocker/cubic-spline via Spline.java).
        // Used to turn a small set of (progress -> value) control points into a
        // smooth curve, e.g. "scale peaks at 1.03 when 70% through the word".
        class Spline {
            constructor(xs, ys) {
                this.xs = xs;
                this.ys = ys;
                this.ks = this._naturalKs(new Array(xs.length).fill(0));
            }
            _naturalKs(ks) {
                const xs = this.xs, ys = this.ys, n = xs.length - 1;
                const a = Array.from({ length: n + 1 }, () => new Array(n + 2).fill(0));
                for (let i = 1; i < n; i++) {
                    a[i][i - 1] = 1 / (xs[i] - xs[i - 1]);
                    a[i][i] = 2 * (1 / (xs[i] - xs[i - 1]) + 1 / (xs[i + 1] - xs[i]));
                    a[i][i + 1] = 1 / (xs[i + 1] - xs[i]);
                    a[i][n + 1] = 3 * ((ys[i] - ys[i - 1]) / (xs[i] - xs[i - 1]) ** 2 + (ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]) ** 2);
                }
                a[0][0] = 2 / (xs[1] - xs[0]);
                a[0][1] = 1 / (xs[1] - xs[0]);
                a[0][n + 1] = 3 * (ys[1] - ys[0]) / (xs[1] - xs[0]) ** 2;
                a[n][n - 1] = 1 / (xs[n] - xs[n - 1]);
                a[n][n] = 2 / (xs[n] - xs[n - 1]);
                a[n][n + 1] = 3 * (ys[n] - ys[n - 1]) / (xs[n] - xs[n - 1]) ** 2;
                return this._solve(a, ks);
            }
            _indexBefore(target) {
                const xs = this.xs;
                let low = 0, high = xs.length, mid = 0;
                while (low < high) {
                    mid = Math.floor((low + high) / 2);
                    if (xs[mid] < target && mid !== low) low = mid;
                    else if (xs[mid] >= target && mid !== high) high = mid;
                    else high = low;
                }
                return low === xs.length - 1 ? xs.length - 1 : low + 1;
            }
            at(x) {
                const xs = this.xs, ys = this.ys, ks = this.ks;
                const i = this._indexBefore(x);
                const t = (x - xs[i - 1]) / (xs[i] - xs[i - 1]);
                const a = ks[i - 1] * (xs[i] - xs[i - 1]) - (ys[i] - ys[i - 1]);
                const b = -ks[i] * (xs[i] - xs[i - 1]) + (ys[i] - ys[i - 1]);
                return (1 - t) * ys[i - 1] + t * ys[i] + t * (1 - t) * (a * (1 - t) + b * t);
            }
            _solve(a, ks) {
                const m = a.length;
                let h = 0, k = 0;
                while (h < m && k <= m) {
                    let iMax = h, max = -Infinity;
                    for (let i = h; i < m; i++) {
                        const v = Math.abs(a[i][k]);
                        if (v > max) { iMax = i; max = v; }
                    }
                    if (a[iMax][k] === 0) {
                        k++;
                    } else {
                        [a[h], a[iMax]] = [a[iMax], a[h]];
                        for (let i = h + 1; i < m; i++) {
                            const f = a[i][k] / a[h][k];
                            a[i][k] = 0;
                            for (let j = k + 1; j <= m; j++) a[i][j] -= a[h][j] * f;
                        }
                        h++; k++;
                    }
                }
                for (let i = m - 1; i >= 0; i--) {
                    let v = a[i][i] !== 0 ? a[i][m] / a[i][i] : 0;
                    ks[i] = v;
                    for (let j = i - 1; j >= 0; j--) {
                        a[j][m] -= a[j][i] * v;
                        a[j][i] = 0;
                    }
                }
                return ks;
            }
        }

        // Damped harmonic oscillator (port of Spring.java). Each word's scale,
        // lift and glow "chase" a target value through this instead of snapping
        // to it, which is what gives the animation its organic bounce.
        class Spring {
            constructor(initial, dampingRatio, frequency) {
                this.dampingRatio = dampingRatio;
                this.frequency = frequency;
                this.velocity = 0;
                this.position = initial;
                this.finalPosition = initial;
            }
            update(deltaTime) {
                const w = this.frequency * (Math.PI * 2);
                const finalPosition = this.finalPosition;
                const velocity = this.velocity;
                const offset = this.position - finalPosition;
                const d = this.dampingRatio;
                const decay = Math.exp(-d * w * deltaTime);
                let newPosition, newVelocity;

                if (d === 1) {
                    newPosition = ((offset * (1 + w * deltaTime) + velocity * deltaTime) * decay) + finalPosition;
                    newVelocity = (velocity * (1 - w * deltaTime) - offset * (w * w * deltaTime)) * decay;
                } else if (d < 1) {
                    const c = Math.sqrt(1 - d * d);
                    const i = Math.cos(w * c * deltaTime);
                    const j = Math.sin(w * c * deltaTime);
                    const z = c > 1e-4 ? j / c : (deltaTime * w);
                    const y = (w * c) > 1e-4 ? j / (w * c) : deltaTime;
                    newPosition = ((offset * (i + d * z) + velocity * y) * decay) + finalPosition;
                    newVelocity = (velocity * (i - z * d) - offset * (z * w)) * decay;
                } else {
                    const c = Math.sqrt(d * d - 1);
                    const r1 = -w * (d - c);
                    const r2 = -w * (d + c);
                    const co2 = (velocity - offset * r1) / (2 * w * c);
                    const co1 = offset - co2;
                    const e1 = co1 * Math.exp(r1 * deltaTime);
                    const e2 = co2 * Math.exp(r2 * deltaTime);
                    newPosition = e1 + e2 + finalPosition;
                    newVelocity = (e1 * r1) + (e2 * r2);
                }

                this.position = newPosition;
                this.velocity = newVelocity;
                return newPosition;
            }
        }

        // Same control points/spring constants as the Android app's non-"Apple
        // style" (Beautiful Lyrics) preset.
        const scaleCurve = new Spline([0, 0.7, 1], [1, 1.03, 1]);
        const scaleCurveEmphasized = new Spline([0, 0.3, 1], [1, 1.25, 1]);
        const yOffsetCurve = new Spline([0, 0.9, 1], [1 / 100, -(1 / 60), 0]);
        const glowCurve = new Spline([0, 0.15, 0.6, 1], [0, 1, 1, 0]);

        function newWordSprings() {
            return {
                scale: new Spring(1, 0.6, 0.7),
                yOffset: new Spring(0, 0.4, 1.25),
                glow: new Spring(0, 0.5, 1)
            };
        }

        function clamp01(x) { return Math.max(0, Math.min(1, x)); }

        // Steps one word's springs toward its curve targets for this frame and
        // writes the result onto the span as CSS custom properties.
        function updateWordVisual(el, w, elapsed, dt) {
            if (!el || !w || w.time === null || !w.springs) return;
            const duration = Math.max(0.0001, w.endTime - w.time);
            const timeScale = clamp01((elapsed - w.time) / duration);
            const emphasized = duration >= 1;

            const s = w.springs;
            s.scale.finalPosition = (emphasized ? scaleCurveEmphasized : scaleCurve).at(timeScale);
            s.yOffset.finalPosition = yOffsetCurve.at(timeScale) * (emphasized ? 2 : 1);
            s.glow.finalPosition = glowCurve.at(timeScale) * (emphasized ? 3 : 1);

            const scale = s.scale.update(dt);
            const yOffset = s.yOffset.update(dt);
            const glow = Math.max(0, s.glow.update(dt));
            const fill = Math.max(0, Math.min(100, -20 + 120 * timeScale));

            el.style.setProperty('--s', scale.toFixed(4));
            el.style.setProperty('--y', yOffset.toFixed(4) + 'em');
            el.style.setProperty('--glow-blur', (glow * 8).toFixed(2) + 'px');
            el.style.setProperty('--fill', fill.toFixed(2) + '%');
        }

        // Freezes a line's words at rest — fully bright (already sung) or fully
        // dim (not reached yet) — instead of running springs on lines the
        // listener isn't currently looking at.
        function freezeLineVisual(lineEl, alreadySung) {
            lineEl.querySelectorAll('.lyric-word').forEach(el => {
                el.style.setProperty('--s', '1');
                el.style.setProperty('--y', '0em');
                el.style.setProperty('--glow-blur', '0px');
                el.style.setProperty('--fill', alreadySung ? '100%' : '0%');
            });
        }

        let lastAnimTime = null;
        // Fetches lyrics by Spotify track ID via our own Netlify function, which
        // proxies spotifyplus-api (github.com/LeNerd46/spotifyplus-api). That API
        // can return three shapes depending on what it found:
        //   'Syllable' -> Apple Music word/syllable-synced ("beautiful lyrics") karaoke data
        //   'Line'     -> line-synced only (e.g. LRCLIB fallback)
        //   'Static'   -> plain text, no timing at all
        async function fetchLyrics(trackId) {
            try {
                const res = await fetch(`/.netlify/functions/lyrics?id=${encodeURIComponent(trackId)}`);
                if (!res.ok) return null;
                const data = await res.json();
                if (!data || data.error) return null;
                return data;
            } catch (e) {
                return null;
            }
        }

        // Normalizes any of the three lyric shapes into a flat array of lines,
        // each holding its own array of timed "words" (syllable chunks for
        // word-synced tracks, or one word == the whole line for line/static ones).
        function parseLyrics(data) {
            if (!data || !data.Type) return [];

            if (data.Type === 'Syllable') {
                return data.Content.map(item => {
                    if (item.Type === 'Interlude') {
                        return {
                            time: item.StartTime,
                            endTime: item.EndTime,
                            words: [{ time: item.StartTime, endTime: item.EndTime, text: '♫', isPartOfWord: false }]
                        };
                    }
                    const lead = item.Lead;
                    return {
                        time: lead.StartTime,
                        endTime: lead.EndTime,
                        words: lead.Syllables.map(s => ({
                            time: s.StartTime,
                            endTime: s.EndTime,
                            text: s.Text,
                            isPartOfWord: !!s.IsPartOfWord
                        }))
                    };
                });
            }

            if (data.Type === 'Line') {
                return data.Content.map(item => {
                    if (item.Type === 'Interlude') {
                        return {
                            time: item.StartTime,
                            endTime: item.EndTime,
                            words: [{ time: item.StartTime, endTime: item.EndTime, text: '♫', isPartOfWord: false }]
                        };
                    }
                    return {
                        time: item.StartTime,
                        endTime: item.EndTime,
                        words: [{ time: item.StartTime, endTime: item.EndTime, text: item.Text, isPartOfWord: false }]
                    };
                });
            }

            if (data.Type === 'Static') {
                return data.Lines.map(l => ({
                    time: null,
                    endTime: null,
                    words: [{ time: null, endTime: null, text: l.Text, isPartOfWord: false }]
                }));
            }

            return [];
        }

        function escapeHtml(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        // Renders a line's words as spans. Syllables flagged IsPartOfWord attach
        // directly to the next one (no space) so multi-syllable words stay joined.
        function renderLineHTML(line) {
            return line.words.map((w, idx) => {
                const needsSpaceAfter = !w.isPartOfWord && idx < line.words.length - 1;
                const text = escapeHtml(w.text) + (needsSpaceAfter ? '&nbsp;' : '');
                return `<span class="lyric-word">${text}</span>`;
            }).join('');
        }

        let parsedLyrics = [];

        let lastCurrent = -1;

        function highlightLyric() {
            if (!parsedLyrics.length || !spotifyData?.timestamps) return;
            const now = performance.now();
            const dt = lastAnimTime === null ? 0 : Math.min(0.1, (now - lastAnimTime) / 1000);
            lastAnimTime = now;

            const elapsed = (Date.now() - spotifyData.timestamps.start) / 1000;

            let current = 0;
            for (let i = 0; i < parsedLyrics.length; i++) {
                if (parsedLyrics[i].time !== null && parsedLyrics[i].time <= elapsed) current = i;
            }

            const box = document.getElementById('lyrics-box');
            const container = document.getElementById('lyrics-container');
            const lines = container.querySelectorAll('.lyric-line');

            if (current !== lastCurrent) {
                lastCurrent = current;

                if (lines[current]) {
                    const boxHeight = box.clientHeight;
                    const lineTop = lines[current].offsetTop;
                    const lineHeight = lines[current].offsetHeight;
                    const offset = lineTop - (boxHeight / 2) + (lineHeight / 2);
                    container.style.transform = `translateY(-${offset}px)`;
                }

                lines.forEach((line, idx) => {
                    line.classList.toggle('active', idx === current);
                    if (idx !== current) {
                        freezeLineVisual(line, idx < current);
                    }
                });
            }

            // Word-by-word progress within the active line, spring-animated.
            const activeLineEl = lines[current];
            const activeWords = parsedLyrics[current]?.words;
            if (activeLineEl && activeWords) {
                const wordEls = activeLineEl.querySelectorAll('.lyric-word');
                wordEls.forEach((el, idx) => updateWordVisual(el, activeWords[idx], elapsed, dt));
            }

            requestAnimationFrame(highlightLyric);
        }
        function toggleVideo() {
            if (video.paused) {
                video.play();
                btnPath.setAttribute('d', 'M6 19h4V5H6v14zm8-14v14h4V5h-4z'); 
            } else {
                video.pause();
                btnPath.setAttribute('d', 'M8 5v14l11-7z'); 
            }
        }

       function scrambleText(element, newText) {
            clearInterval(element.interval);
            let currentText = element.innerText;
            let frame = 0;
            const maxFrames = 40; 
            const frameDelay = 30; 

            element.interval = setInterval(() => {
                let result = '';
                let progress = frame / maxFrames;
                let currentLength = Math.round(currentText.length + (newText.length - currentText.length) * progress);

                for (let i = 0; i < currentLength; i++) {
                    if (progress > 0.7 && i < newText.length && Math.random() < (progress - 0.5) * 2) {
                        result += newText[i];
                    } else {
                        result += chars[Math.floor(Math.random() * chars.length)];
                    }
                }

                element.innerText = result;
                if (frame >= maxFrames) {
                    element.innerText = newText;
                    clearInterval(element.interval);
                }
                frame++;
            }, frameDelay);
        }



        async function updateSpotify() {
                    if (document.hidden) return;
                    try {
                        // Call your secure Netlify function directly
                        const res = await fetch("/.netlify/functions/spotify");
                        const d = await res.json();
        
                        if (!d.is_playing) {
                            spotifyData = null;
                            document.getElementById('lyrics-box').style.display = 'none';
                            if (spotifyWrapper.classList.contains('active')) {
                                spotifyWrapper.classList.remove('active');
                                content.classList.remove('spotify-active');
                                dynamicFavicon.href = 'icon.jpg';
                                lastTrackId = '';
                            }
                            return;
                        }
        
                        spotifyData = {
                            track_id:      d.track_id,
                            song:          d.song,
                            artist:        d.artist,
                            album_art_url: d.album_art_url,
                            url:           d.url,
                            timestamps: {
                                start: Date.now() - d.progress_ms,
                                end:   Date.now() - d.progress_ms + d.duration_ms,
                            },
                        };
        
                        const s = spotifyData;
                        if (s.track_id !== lastTrackId) {
                            spotifyArt.style.opacity = 0;
                            setTimeout(() => {
                                spotifyArt.src = s.album_art_url || '';
                                dynamicFavicon.href = s.album_art_url || 'icon.jpg';
                                spotifyArt.onload = () => {
                                    spotifyArt.style.opacity = 1;
                                    try {
                                        const color = colorThief.getColor(spotifyArt);
                                        const rgb = `rgb(${color[0]}, ${color[1]}, ${color[2]})`;
                                        spotifyArtist.style.color = rgb;
                                        spotifyProgressBar.style.background = rgb;
                                        document.documentElement.style.setProperty('--accent-color', rgb);
                                    } catch (e) {
                                        spotifyArtist.style.color = '#1DB954';
                                        spotifyProgressBar.style.background = '#1DB954';
                                        document.documentElement.style.setProperty('--accent-color', '#1DB954');
                                    }
                                };
                            }, 500);
                            scrambleText(spotifyName, s.song || '...');
                            scrambleText(spotifyArtist, s.artist || '...');
                            lastTrackId = s.track_id;
                            fetchLyrics(s.track_id).then(lyricsData => {
                                const box = document.getElementById('lyrics-box');
                                const container = document.getElementById('lyrics-container');
                                parsedLyrics = parseLyrics(lyricsData);
                                parsedLyrics.forEach(line => line.words.forEach(w => { w.springs = newWordSprings(); }));
                                if (parsedLyrics.length) {
                                    container.innerHTML = parsedLyrics.map(line =>
                                        `<div class="lyric-line">${renderLineHTML(line)}</div>`
                                    ).join('');
                                    box.style.display = 'block';
                                    container.style.transform = 'translateY(0px)';
                                    lastCurrent = -1;
                                    lastAnimTime = null;
                                    highlightLyric();
                                } else {
                                    container.innerHTML = '';
                                    container.style.transform = 'translateY(0px)';
                                    box.style.display = 'none';
                                }
                            });
                        }
                        if (!spotifyWrapper.classList.contains('active')) {
                            spotifyWrapper.classList.add('active');
                            content.classList.add('spotify-active');
                        }
                    } catch (e) {}
                }
        
        setInterval(updateSpotify, 2000);

        function animateProgress() {
            if (spotifyData && spotifyData.timestamps) {
                const start = spotifyData.timestamps.start;
                const end = spotifyData.timestamps.end;
                const now = Date.now();
                const percent = Math.min(100, Math.max(0, ((now - start) / (end - start)) * 100));
                spotifyProgressBar.style.width = percent + '%';
            }
            requestAnimationFrame(animateProgress);
        }

        animateProgress();

        function drawAmbilight() {
            if (!video.paused && !video.ended) ambCtx.drawImage(video, 0, 0, ambCanvas.width, ambCanvas.height);
            requestAnimationFrame(drawAmbilight);
        }

        function startBio() {
            if (!/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
                content.style.zoom = "1.4";
            }
            
            enterScreen.style.opacity = '0';
            updateSpotify();
            notifyVisitor();
            setTimeout(() => {
                enterScreen.style.display = 'none';
                content.classList.add('visible-content');
                ambCanvas.width = 64; ambCanvas.height = 36; 
                video.muted = true;
                video.play().then(() => { ambCanvas.style.opacity = "1"; drawAmbilight(); });
            }, 800);
        }

        document.getElementById('volume-slider').addEventListener('input', (e) => { video.volume = e.target.value; });

        const tooltip = document.getElementById('custom-tooltip');
        document.querySelectorAll('.icon-link').forEach(link => {
            link.addEventListener('mouseenter', () => { tooltip.innerText = link.getAttribute('data-tip'); tooltip.classList.add('show'); });
            link.addEventListener('mousemove', (e) => { tooltip.style.left = (e.clientX + 20) + 'px'; tooltip.style.top = (e.clientY + 20) + 'px'; });
            link.addEventListener('mouseleave', () => { tooltip.classList.remove('show'); });
        });
        
        async function notifyVisitor() {
            if (sessionStorage.getItem("visited_recently")) return;

            try {
                await fetch("/.netlify/functions/visitor", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        screenRes: `${window.screen.width}x${window.screen.height}`,
                        refUrl: window.location.search || "Direct / None",
                        userAgent: navigator.userAgent
                    })
                });

                sessionStorage.setItem("visited_recently", "true");
            } catch (e) {
                console.error("Tracking error:", e);
            }
        }

        
    </script>
